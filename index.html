<style>
  :root{
    --bg: #1e2015;
    --bg-panel: #262a1a;
    --accent: #737a49;
    --stencil: #ded7bc;
    --ink-muted: #93997c;
    --line: rgba(222,215,188,0.14);
  }
  *{ box-sizing:border-box; }
  html,body{ margin:0; padding:0; height:100%; }
  body{
    background:
      repeating-linear-gradient(135deg, rgba(255,255,255,0.015) 0px, rgba(255,255,255,0.015) 2px, transparent 2px, transparent 14px),
      var(--bg);
    color:var(--stencil);
    font-family:'Inter', sans-serif;
    min-height:100vh;
    display:flex; align-items:center; justify-content:center;
    padding:40px 20px;
  }
  .card{
    max-width:760px; width:100%;
    background:var(--bg-panel);
    border:1px dashed var(--line);
    border-radius:6px;
    padding:36px 32px;
    position:relative;
  }
  .stamp{
    position:absolute; top:-14px; right:24px;
    background:var(--bg); border:1px solid var(--accent); color:var(--accent);
    font-family:'IBM Plex Mono', monospace; font-size:10px; letter-spacing:0.14em; text-transform:uppercase;
    padding:3px 10px; border-radius:3px; transform:rotate(-3deg);
  }
  h1{
    font-family:'Oswald', sans-serif; font-weight:700; text-transform:uppercase; letter-spacing:0.02em;
    font-size:clamp(24px, 5vw, 32px); margin:10px 0 14px; color:var(--stencil);
  }
  p.desc{ color:var(--ink-muted); font-size:14px; line-height:1.6; margin:0 0 18px; }
  ul.features{ list-style:none; padding:0; margin:0 0 24px; }
  ul.features li{
    font-family:'IBM Plex Mono', monospace; font-size:13px; color:var(--stencil);
    padding:7px 0 7px 20px; border-bottom:1px solid var(--line); position:relative;
  }
  ul.features li:last-child{ border-bottom:none; }
  ul.features li::before{ content:"›"; position:absolute; left:0; color:var(--accent); }
  .manifest{
    font-family:'IBM Plex Mono', monospace; font-size:12px; color:var(--ink-muted);
    margin-bottom:22px; padding-top:14px; border-top:1px solid var(--line);
  }
  .viewport{
    margin:24px 0 26px;
    border-radius:8px;
    background:#141712;
    border:1px solid var(--line);
    padding:10px;
  }
  .viewport-label{
    font-family:'IBM Plex Mono', monospace; font-size:10px; letter-spacing:0.14em; text-transform:uppercase;
    color:var(--ink-muted); margin-bottom:8px; display:flex; align-items:center; justify-content:space-between;
  }
  .viewport-dot{
    width:7px; height:7px; border-radius:50%; background:var(--accent); display:inline-block; margin-right:6px;
  }
  .viewport-frame-wrap{
    border-radius:5px; overflow:hidden; border:1px solid var(--line); background:#fff;
  }
  #preview-frame{
    width:100%; height:520px; border:none; display:block; background:#fff;
  }
  #preview-note{ font-size:11px; color:var(--ink-muted); margin-top:6px; min-height:14px; }
  .btn-download{
    display:block; width:100%; text-align:center; border:none; border-radius:5px;
    background:var(--accent); color:#1e2015; padding:15px 20px;
    font-family:'Oswald', sans-serif; font-weight:600; text-transform:uppercase; letter-spacing:0.05em;
    font-size:15px; cursor:pointer; transition:filter .15s ease;
  }
  .btn-download:hover{ filter:brightness(1.12); }
  .btn-download:active{ transform:translateY(1px); }
  #dl-status{ text-align:center; font-size:12px; color:var(--ink-muted); margin-top:12px; font-family:'IBM Plex Mono', monospace; min-height:16px; }
</style>
</head>

  const MIME_TYPE = "text/html";
  const FILE_NAME = "Меню_столової.html";

  function decodeToBytes(){
    const binary = atob(B64_DATA);
    const bytes = new Uint8Array(binary.length);
    for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
    return bytes;
  }

  document.getElementById("dl-btn").addEventListener("click", () => {

      const a = document.createElement("a");
      a.href = url;
      a.download = FILE_NAME;
      document.body.appendChild(a);
      a.click();
      a.remove();
      URL.revokeObjectURL(url);
